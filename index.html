    #splashScreen {
      position: fixed;

      z-index: 99999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: opacity 0.4s ease, visibility 0.4s ease;
    }

    .splash-logo-box {
      width: 120px; height: 120px;
      border-radius: 28px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
      animation: zoomInLogo 1.2s cubic-bezier(0.175, 0.885, 0.32, 1.275) infinite alternate;
      overflow: hidden;
      border: 3px solid rgba(255,255,255,0.2);
    }

    .splash-logo-box img {
      width: 100%; height: 100%; object-fit: cover;
    }

    @keyframes zoomInLogo {
      0% { transform: scale(0.85); opacity: 0.8; }
      100% { transform: scale(1.05); opacity: 1; filter: drop-shadow(0 0 15px #4ade80); }
    }

    .splash-title {
      color: #ffffff;
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 1px;
      margin-top: 20px;
      text-align: center;

      animation: fadeInText 1s ease-in-out;

      margin-top: 6px;
      letter-spacing: 0.5px;
    }

    @keyframes fadeInText {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }

<body>

  <div id="splashScreen">

  <div class="login-modal-overlay" id="onboardingLocationModal">

      <div style="text-align:center; margin-bottom:12px;">

      <div class="form-group">
        <label>राज्य (State):</label>
        <select id="onboardStateSelect" class="form-control" onchange="onOnboardStateChange()"></select>
      </div>

      <div class="form-group">
        <label>जिला (District):</label>
        <select id="onboardDistrictSelect" class="form-control" onchange="onOnboardDistrictChange()"></select>
      </div>

      <div class="form-group">
        <label>शहर / कस्बा (City / Town):</label>
        <select id="onboardCitySelect" class="form-control" onchange="onOnboardCityChange()"></select>

        ✅ स्थान सेव करें और आगे बढ़ें
      </button>
    </div>
  </div>

        <button class="lang-choice-btn" style="background:#fdf2f8; border-color:#f9a8d4; color:#be185d;" onclick="setAppLanguage('ta')">தமிழ்</button>
